[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfvalidator"
version = "0.1.0"
description = "CHN PDF compliance validator"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pyzbar>=0.1.9",
    "imagehash>=4.3",
    "Pillow>=10.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.35"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
